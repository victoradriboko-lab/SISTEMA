<!doctype html>
<html lang="pt-BR" data-surface="internal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070d17">
  <title>Sistema Informática SERVITEC VSA</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <aside aria-label="Menu principal">
    <div class="brand" aria-label="Sistema Informática SERVITEC VSA">
      <img id="brand-logo" class="brand-logo" alt="Logotipo da empresa" hidden><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M24 3 43 14v20L24 45 5 34V14Z" stroke="currentColor" stroke-width="2"/><path d="M33 16H20l-5 8h18l-5 8H15" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M24 3v7m19 24-6-3M5 34l6-3" stroke="currentColor" stroke-width="2"/></svg></span>
      <div class="brand-wordmark"><span class="brand-caption">SISTEMA INFORMÁTICA</span><span class="brand-name">SERVITEC <small>VSA</small></span></div>
    </div>
    <p class="nav-label">GESTÃO E TECNOLOGIA</p>
    <nav aria-label="Módulos">
      <button data-page="dashboard"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 10h18M10 10v11"/></svg> Dashboard</button>
      <button data-page="tickets"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 9h8M8 13h5"/></svg> Chamados</button>
      <button data-page="assets"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M8 21h8M12 16v5"/></svg> Equipamentos</button>
      <button data-page="monitor"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-7 6 14 3-7h4"/></svg> Monitoramento</button>
      <button data-page="reports" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18h17M9 16v-5m5 5V6m5 10v-8"/></svg> Relatórios</button>
      <button data-page="remote"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg> Acesso remoto</button>
      <button data-page="client-access" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4h10v17M14 9h6v12M8 8h2M8 12h2M8 16h2M17 13h1M17 17h1"/></svg> Acessos de clientes</button>
      <button data-page="users" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v3"/></svg> Usuários e permissões</button>
      <button data-page="settings" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg> Configurações</button>
    </nav>
    <footer><span class="footer-dot" aria-hidden="true"></span> SERVITEC VSA<br><small>Gestão conectada à sua TI.</small></footer>
  </aside>
  <main>
    <header><span class="breadcrumb">SERVITEC VSA <span aria-hidden="true">/</span> <b id="breadcrumb">Dashboard</b></span><div class="header-actions"><span class="workspace-label">CENTRAL DE OPERAÇÕES</span><button id="my-password" hidden>Minha senha</button><button id="logout" hidden>Sair</button><div class="user-preferences" id="operator-preferences" hidden><div class="user-identity"><strong id="operator-name"></strong><small id="operator-role"></small></div><button type="button" class="theme-toggle" data-theme-toggle role="switch" aria-checked="false" aria-label="Modo escuro"><span class="theme-light-label">Claro</span><span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-thumb"></span></span><span class="theme-dark-label">Escuro</span></button></div></div></header>
    <div id="notice" role="status" aria-live="polite"></div>
    <section id="content" aria-label="Conteúdo principal"></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
